name: Build mod
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Unpack zip if the project was uploaded as friendrun.zip
        run: |
          if [ -f friendrun.zip ]; then unzip -o -q friendrun.zip; fi
      - name: Build
        run: |
          if [ -d friendrun ]; then cd friendrun; fi
          gradle build --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: friendrun-mod
          path: out/*.jar
