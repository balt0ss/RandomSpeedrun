name: Build mod from uploaded ZIP

on:
  push:
    paths:
      - 'RandomRunFriends.zip'
      - '.github/workflows/build-zip-upload.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Extract uploaded project ZIP
        run: |
          test -f RandomRunFriends.zip
          mkdir -p project
          unzip -q -o RandomRunFriends.zip -d project
          echo "Extracted files:"
          find project -maxdepth 3 -type f | sort | head -200
          test -f project/build.gradle
          test -f project/settings.gradle
          test -f project/gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build mod JAR
        working-directory: project
        run: gradle --no-daemon clean build

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: RandomRunFriends-JAR
          path: project/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
